name: Hourly IPO Scraper

on:
  repository_dispatch:
    types: [hourly-trigger] # Allows 100% reliable external triggering via webhook
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python execution/ipo_scraper_json_db.py

      - name: Run Telegram Alerter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python execution/telegram_alerter.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add ipo_data.json ipo_data.db
          # Commit changes if there are any, and push back to repo
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPO data" && git push)
